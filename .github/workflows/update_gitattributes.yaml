name: Update Git Attributes

on:
  push:
    branches:
      - alpha
      - development

jobs:
  update_gitattributes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run update_gitattribute.py
        run: |
            ls -la
            python update_gitattribute.py

      - name: Update .gitattributes
        run: |
            git config user.name "GitHub Actions"
            git config user.email "<>"
            if git diff --quiet -- .gitattributes; then
              echo ".gitattributes is already up to date; skipping commit and push."
              exit 0
            fi
            git add .gitattributes
            git commit -m "Update .gitattributes"
            git push
